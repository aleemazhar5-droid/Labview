    <text style="font-size: 6.8px; font-family: 'Inter'; fill: #ffffff" transform="translate(155.561281 63.232055)">watchdog, safeguard memory</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(318.280369 40.814675)">Mass memory</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(311.32665 51.20265)">(Flash/NAND, Tbit,</text>
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(311.576728 60.925984)">EDAC, file system)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(38.546475 40.86005)">TT&amp;C transponder</text>
