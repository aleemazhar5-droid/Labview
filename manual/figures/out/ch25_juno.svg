   <g id="text_1">
    <text style="font-size: 6.2px; font-family: 'Inter'; fill: #1b1f24" transform="translate(186.762462 133.012197)">Radiation design:</text>
    <text style="font-size: 6.2px; font-family: 'Inter'; fill: #1b1f24" transform="translate(186.762462 142.595253)">• electronics in a 1 cm titanium vault (≈ 180 kg)</text>
    <text style="font-size: 6.2px; font-family: 'Inter'; fill: #1b1f24" transform="translate(186.762462 151.802919)">• polar orbit passes between the belts and the</text>
    <text style="font-size: 6.2px; font-family: 'Inter'; fill: #1b1f24" transform="translate(186.762462 161.143789)">  atmosphere, minimising dose per orbit</text>
    <text style="font-size: 6.2px; font-family: 'Inter'; fill: #1b1f24" transform="translate(186.762462 170.520986)">• orbit precesses with time, gradually increasing dose</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.2px; font-family: 'Inter'; text-anchor: middle; fill: #b23a48" x="62.972308" y="140.343063" transform="rotate(-0 62.972308 140.343063)">most intense radiation belts</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1f6fb2" transform="translate(84.004615 18.496683)">53-day polar orbit:</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1f6fb2" transform="translate(84.004615 26.240433)">perijove ≈ 4 000 km above the clouds,</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1f6fb2" transform="translate(84.004615 33.984183)">apojove ≈ 8 million km</text>
   </g>
   <g id="text_4">
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1f6fb2" transform="translate(73.488462 88.0139)">fast dive</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1f6fb2" transform="translate(73.488462 95.031673)">under the belts</text>
   </g>
  </g>
