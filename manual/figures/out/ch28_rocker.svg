   <g id="text_1">
    <text style="font-size: 7px; font-family: 'Inter'; text-anchor: middle; fill: #1b1f24" x="178.65" y="67.922387" transform="rotate(-0 178.65 67.922387)">Body (warm electronics box)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(291.924 56.054375)">Differential: when one rocker</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(291.924 63.798125)">tilts up, the other tilts down,</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(291.924 71.541875)">keeping the body level</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; text-anchor: middle; fill: #d9772b" x="217.71" y="93.311387" transform="rotate(-0 217.71 93.311387)">Rocker</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Inter'; text-anchor: middle; fill: #1f6fb2" x="49.752" y="105.029387" transform="rotate(-0 49.752 105.029387)">Bogie</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(276.3 106.832375)">Front wheel climbs an</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(276.3 114.576125)">obstacle up to about one</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(276.3 122.319875)">wheel diameter high</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.4px; font-family: 'Inter'; text-anchor: middle; fill: #1b1f24" x="100.53" y="179.025125" transform="rotate(-0 100.53 179.025125)">No springs: all six wheels stay in contact, sharing the load</text>
   </g>
