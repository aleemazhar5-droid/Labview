   <g id="text_14">
    <text style="font-size: 6.3px; font-family: 'Inter'; text-anchor: end; fill: #7f8c8d" x="568.288266" y="218.324565" transform="rotate(-0 568.288266 218.324565)">Schematic. At sunset the lifting gas cools and a zero-pressure balloon sinks until ballast is released; at sunrise it warms and rises, venting gas. Each night costs ballast, limiting flight duration.</text>
