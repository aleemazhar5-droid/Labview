  </g>
  <g id="text_25">
   <text style="font-size: 5.9px; font-family: 'Inter'; text-anchor: end; fill: #7f8c8d" x="548.568234" y="205.576855" transform="rotate(-0 548.568234 205.576855)">Ideal exhaust speed if all the released energy went into the reacted mass alone (non-relativistic estimate). Real engines also heat or push inert propellant and lose energy as radiation and neutrons.</text>
