    <text style="font-size: 6.6px; font-family: 'Inter'; text-anchor: start" x="320.971601" y="139.004339" transform="rotate(-0 320.971601 139.004339)">9.0×10¹⁶ J/kg · E = mc²: all mass becomes energy</text>
   </g>
  </g>
  <g id="text_25">
   <text style="font-size: 5.9px; font-family: 'Inter'; fill: #7f8c8d" transform="translate(169.292266 198.438086)">Ideal exhaust speed if all the released energy went into the reacted mass alone (non-relativistic estimate).</text>
   <text style="font-size: 5.9px; font-family: 'Inter'; fill: #7f8c8d" transform="translate(214.199562 205.576855)">Real engines also heat or push inert propellant and lose energy as radiation and neutrons.</text>
