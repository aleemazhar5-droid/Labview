   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.8px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="33.585231" y="59.471602" transform="rotate(-0 33.585231 59.471602)">Sensors</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(14.477575 77.351705)">camera, lidar,</text>
    <text style="font-size: 6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(17.381481 87.20565)">star tracker</text>
    <text style="font-size: 6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(33.585231 94.498814)"/>
    <text style="font-size: 6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(22.123825 105.928697)">context:</text>
    <text style="font-size: 6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(6.421168 114.98108)">Sun angle, altitude,</text>
    <text style="font-size: 6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(17.77945 124.540181)">mode, time</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 6.8px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="144.891692" y="36.365916" transform="rotate(-0 144.891692 36.365916)">Learned function</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(106.609349 50.937744)">e.g. neural hazard detector</text>
    <text style="font-size: 6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(107.948099 60.478096)">high performance, hard to</text>
    <text style="font-size: 6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(118.152317 70.084072)">verify (category C)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 6.8px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="144.891692" y="147.672377" transform="rotate(-0 144.891692 147.672377)">Baseline function</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(107.352317 162.346862)">e.g. plane fit to lidar slope,</text>
    <text style="font-size: 6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(106.742474 171.807995)">or a pre-surveyed safe site</text>
    <text style="font-size: 6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(114.856067 181.390534)">(verified, category B)</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="144.891692" y="93.251365" transform="rotate(-0 144.891692 93.251365)">Input monitor</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.9px; font-family: 'Inter'; fill: #1b1f24" transform="translate(108.587333 106.179103)">inside the design domain?</text>
    <text style="font-size: 5.9px; font-family: 'Inter'; fill: #1b1f24" transform="translate(110.008864 115.459503)">Sun angle, image quality,</text>
    <text style="font-size: 5.9px; font-family: 'Inter'; fill: #1b1f24" transform="translate(110.700731 125.37231)">out-of-distribution score</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="248.521846" y="36.293162" transform="rotate(-0 248.521846 36.293162)">Output monitor</text>
   </g>
   <g id="text_10">
    <text style="font-size: 5.9px; font-family: 'Inter'; fill: #1b1f24" transform="translate(222.221213 51.163023)">plausible? physics,</text>
    <text style="font-size: 5.9px; font-family: 'Inter'; fill: #1b1f24" transform="translate(217.176713 60.443424)">consistency over time,</text>
    <text style="font-size: 5.9px; font-family: 'Inter'; fill: #1b1f24" transform="translate(226.323096 69.754246)">safety envelope</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 6.6px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="252.36" y="105.456694" transform="rotate(-0 252.36 105.456694)">Arbiter</text>
   </g>
   <g id="text_12">
    <text style="font-size: 5.9px; font-family: 'Inter'; fill: #1b1f24" transform="translate(231.990711 126.182279)">learned output</text>
    <text style="font-size: 5.9px; font-family: 'Inter'; fill: #1b1f24" transform="translate(236.710711 135.552101)">only if both</text>
    <text style="font-size: 5.9px; font-family: 'Inter'; fill: #1b1f24" transform="translate(231.850586 144.813603)">monitors pass;</text>
    <text style="font-size: 5.9px; font-family: 'Inter'; fill: #1b1f24" transform="translate(234.158961 154.658652)">else baseline</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'Inter'; fill: #ffffff" transform="translate(324.852769 82.321296)">Guidance and</text>
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'Inter'; fill: #ffffff" transform="translate(335.330769 90.065046)">control</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(327.153519 105.358036)">commands to</text>
    <text style="font-size: 6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(334.33805 114.258075)">engines,</text>
    <text style="font-size: 6px; font-family: 'Inter'; fill: #1b1f24" transform="translate(333.738988 124.236239)">thrusters</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 6.4px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="346.394769" y="26.701787" transform="rotate(-0 346.394769 26.701787)">Logs to ground</text>
   </g>
   <g id="text_16">
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(318.194082 40.590175)">monitor trips, inputs,</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(312.9768 49.709202)">for review and retraining</text>
   </g>
