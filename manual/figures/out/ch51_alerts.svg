   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="51.39" y="25.253095" transform="rotate(-0 51.39 25.253095)">Telescope and camera</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(29.495656 48.466784)">3.2 gigapixels</text>
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(32.389742 58.984606)">every ~40 s</text>
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(25.329617 69.544304)">~10 TB per night</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="145.638" y="25.253095" transform="rotate(-0 145.638 25.253095)">Difference imaging</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(121.567203 48.466784)">calibrate, align,</text>
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(120.815547 58.964716)">subtract a deep</text>
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(121.349977 69.544304)">template image</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="239.886" y="25.253095" transform="rotate(-0 239.886 25.253095)">Real/bogus filter</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(215.356148 48.506042)">network rejects</text>
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(212.602867 59.175661)">artefacts, cosmic</text>
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(204.659703 69.570475)">rays, bad subtractions</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="334.134" y="25.253095" transform="rotate(-0 334.134 25.253095)">Alert packets</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(301.443758 48.602354)">≤ 82 KB each, within</text>
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(298.133539 59.044802)">60 s; up to 7–10 million</text>
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(320.004852 69.544304)">per night</text>
   </g>
