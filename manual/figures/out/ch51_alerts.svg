   </g>
   <g id="text_10">
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(294.803953 144.713698)">cross-match catalogues;</text>
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(301.668312 155.393262)">classify with forests,</text>
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(313.991078 165.959764)">CNNs, RNNs</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="239.886" y="122.273095" transform="rotate(-0 239.886 122.273095)">Filters and ranking</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(209.764266 145.5088)">each team asks for</text>
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(201.224906 155.332544)">'young SN Ia', 'kilonova',</text>
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(219.384523 166.507804)">'new NEO' ...</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="145.638" y="122.273095" transform="rotate(-0 145.638 122.273095)">Follow-up</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(111.83493 144.752956)">spectra, other bands,</text>
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(118.186844 155.291716)">other telescopes:</text>
    <text style="font-size: 6.7px; font-family: 'Inter'; fill: #1b1f24" transform="translate(107.260086 165.871304)">tens to hundreds a night</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 7.4px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="51.39" y="122.273095" transform="rotate(-0 51.39 122.273095)">Labels and catalogues</text>
   </g>
