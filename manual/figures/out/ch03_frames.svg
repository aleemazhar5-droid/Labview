   <g id="text_9">
    <text style="font-size: 7.2px; font-family: 'Inter'" transform="translate(245.052 106.012687)">RTN / RSW / LVLH: orbit-fixed frames used</text>
    <text style="font-size: 7.2px; font-family: 'Inter'" transform="translate(245.052 114.724406)">for relative motion, rendezvous, attitude</text>
    <text style="font-size: 7.2px; font-family: 'Inter'" transform="translate(245.052 123.436125)">and covariance (radial, in-track, cross-track).</text>
    <text style="font-size: 7.2px; font-family: 'Inter'" transform="translate(245.052 132.147844)"/>
    <text style="font-size: 7.2px; font-family: 'Inter'" transform="translate(245.052 140.859563)">Body frame: fixed to the spacecraft.</text>
    <text style="font-size: 7.2px; font-family: 'Inter'" transform="translate(245.052 149.571281)">Perifocal (PQW): x to periapsis, z = orbit normal.</text>
   </g>
