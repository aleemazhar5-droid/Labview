     <text style="font-size: 6px; font-family: 'Inter'; text-anchor: start" x="62.232148" y="153.643633" transform="rotate(-0 62.232148 153.643633)">Electrical output (model: 470 W at launch, ≈ 220 W in 2026)</text>
