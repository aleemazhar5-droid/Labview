   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="71.1792" y="30.443024" transform="rotate(-0 71.1792 30.443024)">Solar fixed-wing (HTA)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(26.6172 61.173535)">Zephyr, PHASA-35, Sunglider</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(71.1792 69.52641)"/>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(32.7977 81.307285)">+ station-keeping in wind</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(27.4267 91.96966)">+ can be recovered &amp; reused</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(40.8687 101.364535)">− payload ≈ 5–15 kg</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(24.3727 111.79091)">− fragile; ≤ 25 kg/m² wing load</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(31.8157 121.574785)">− winter night energy limit</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="203.76" y="30.443024" transform="rotate(-0 203.76 30.443024)">Airship (LTA, powered)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(160.9385 61.198535)">Sceye, Stratobus, HiSentinel</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(203.76 69.52641)"/>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(171.7785 81.262285)">+ payload 50–250 kg</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(164.052 91.31966)">+ large solar area &amp; power</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(158.5 101.653535)">− huge volume (≈ 100 m long)</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(162.7935 111.50791)">− drag; hard to hold station</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(178.902 121.574785)">  in strong winds</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.4px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="336.3408" y="30.443024" transform="rotate(-0 336.3408 30.443024)">Free balloon (LTA, unpowered)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(293.0348 61.258035)">Loon, Aerostar, NASA, CNES</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(336.3408 69.52641)"/>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(297.9658 81.340285)">+ cheapest per flight-day</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(295.8158 91.46516)">+ heavy payloads (to 3.6 t)</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(296.6813 101.441035)">− goes where wind blows;</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(295.3018 111.50791)">  steer by changing altitude</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(288.9598 121.645285)">− fleets needed for persistence</text>
   </g>
  </g>
 </g>
