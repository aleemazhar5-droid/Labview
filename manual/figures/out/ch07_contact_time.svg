    <text style="font-size: 6.6px; font-family: 'Inter'; fill: #7f8c8d" transform="translate(189.776079 47.6016) rotate(-90)">McMurdo</text>
   </g>
   <g id="text_25">
    <text style="font-size: 6.3px; font-family: 'Inter'; text-anchor: end; fill: #7f8c8d" x="530.694" y="221.207445" transform="rotate(-0 530.694 221.207445)">Computed for a 600 km sun-synchronous satellite, 5° minimum elevation (3-day average). Polar stations see every orbit — the reason for Svalbard and Antarctic ground stations.</text>
