   <g id="text_1">
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(122.344 58.679469)">Carrier phase λ ≈ 19 cm (L1): measured to ≈ 1 mm,</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(113.437 68.175156)">but the whole number of cycles (ambiguity) is unknown.</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(120.9195 77.821844)">Differencing with the base cancels common errors;</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(136.0465 87.468531)">resolving ambiguities gives cm accuracy.</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.6px; font-family: 'Inter'; text-anchor: middle; fill: #2e8b57" x="190.368" y="116.124408" transform="rotate(-0 190.368 116.124408)">corrections via radio / internet (RTCM)</text>
