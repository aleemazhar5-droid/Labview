   <g id="text_1">
    <text style="font-size: 6.2px; font-family: 'Inter'; fill: #1b1f24" transform="translate(23.1912 114.684043)">B-plane: perpendicular to v∞ through the planet's centre.</text>
    <text style="font-size: 6.2px; font-family: 'Inter'; fill: #1b1f24" transform="translate(23.1912 124.085459)">B vector: where the trajectory would pierce it.</text>
    <text style="font-size: 6.2px; font-family: 'Inter'; fill: #1b1f24" transform="translate(23.1912 133.470406)">Navigators target B·R and B·T; the size of the</text>
    <text style="font-size: 6.2px; font-family: 'Inter'; fill: #1b1f24" transform="translate(23.1912 142.839854)">B-plane error ellipse sets the risk and accuracy</text>
    <text style="font-size: 6.2px; font-family: 'Inter'; fill: #1b1f24" transform="translate(23.1912 152.24902)">of flybys, orbit insertion and entry.</text>
   </g>
