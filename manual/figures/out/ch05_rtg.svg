    <text style="font-size: 6.8px; font-family: 'Inter'" transform="translate(6.786 97.893906)">  plus thermocouple ageing)</text>
    <text style="font-size: 6.8px; font-family: 'Inter'" transform="translate(6.786 106.121641)">• mass 45 kg, length 0.66 m</text>
