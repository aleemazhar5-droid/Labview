   </g>
   <g id="text_2">
    <text style="font-size: 6.5px; font-family: 'Inter'; fill: #1b1f24" transform="translate(241.9272 40.847804)">One fringe (2π) =</text>
    <text style="font-size: 6.5px; font-family: 'Inter'; fill: #1b1f24" transform="translate(241.9272 50.496431)">• λ/2 of motion along the line of sight</text>
    <text style="font-size: 6.5px; font-family: 'Inter'; fill: #1b1f24" transform="translate(241.9272 60.641192)">  (2.8 cm at C-band, 12 cm at L-band)</text>
    <text style="font-size: 6.5px; font-family: 'Inter'; fill: #1b1f24" transform="translate(241.9272 70.340601)">• height of ambiguity λR sinθ / (2 B_perp)</text>
    <text style="font-size: 6.5px; font-family: 'Inter'; fill: #1b1f24" transform="translate(241.9272 79.989229)">  of topography</text>
   </g>
