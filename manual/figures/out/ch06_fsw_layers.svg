   <g id="text_1">
    <text style="font-size: 6.8px; font-family: 'Inter'; text-anchor: middle; fill: #1b1f24" x="258.9315" y="161.593633" transform="rotate(-0 258.9315 161.593633)">Hardware: processor, memory, I/O, timers, watchdog</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.8px; font-family: 'Inter'; text-anchor: middle; fill: #1b1f24" x="258.9315" y="143.626033" transform="rotate(-0 258.9315 143.626033)">Board support package &amp; drivers</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.8px; font-family: 'Inter'; text-anchor: middle; fill: #1b1f24" x="258.9315" y="125.658433" transform="rotate(-0 258.9315 125.658433)">Real-time OS (RTEMS, VxWorks, FreeRTOS, Linux+PREEMPT_RT) + OS abstraction layer</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.8px; font-family: 'Inter'; text-anchor: middle; fill: #1b1f24" x="258.9315" y="107.690833" transform="rotate(-0 258.9315 107.690833)">Core flight executive / framework (cFS, F Prime): software bus, time, events, tables</text>
   </g>
   <g id="text_5">
