   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7.5px; font-family: 'Inter'; text-anchor: middle; fill: #2e8b57" x="258.9315" y="44.2836" transform="rotate(-0 258.9315 44.2836)">Applications</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.4px; font-family: 'Inter'; text-anchor: middle; fill: #7f8c8d" x="258.9315" y="179.4312" transform="rotate(-0 258.9315 179.4312)">Layering isolates applications from hardware so that they can be reused across missions (NASA cFS has flown on dozens of spacecraft; JPL's F Prime flew on Ingenuity).</text>
