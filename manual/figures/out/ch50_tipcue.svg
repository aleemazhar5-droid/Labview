   <g id="text_1">
    <text style="font-weight: 700; font-size: 6.5px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="43.507125" y="40.454677" transform="rotate(-0 43.507125 40.454677)">Wide-area sensors</text>
   </g>
   <g id="text_2">
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(20.995422 57.639116)">SAR, optical, RF,</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(14.629469 66.758144)">infrared; government</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(21.67375 76.440405)">and commercial</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 6.5px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="144.107625" y="40.454677" transform="rotate(-0 144.107625 40.454677)">Automated detection</text>
   </g>
   <g id="text_4">
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(121.422828 57.605132)">objects, change,</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(118.18525 66.845597)">emitters, launches;</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(118.689125 76.47303)">confidence scores</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 6.5px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="244.708125" y="40.454677" transform="rotate(-0 244.708125 40.454677)">Fusion and patterns</text>
   </g>
   <g id="text_6">
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(213.798203 57.653163)">tracks across sensors;</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(213.554875 66.750894)">activity compared with</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(220.787656 76.440405)">normal behaviour</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 6.5px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="347.24325" y="40.454677" transform="rotate(-0 347.24325 40.454677)">Analyst review</text>
   </g>
   <g id="text_8">
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(318.160328 58.194195)">checks evidence and</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(323.97075 66.845597)">alternatives; sets</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(318.879438 75.915234)">confidence; explains</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 6.5px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="244.708125" y="125.578177" transform="rotate(-0 244.708125 125.578177)">Cue: task more looks</text>
   </g>
   <g id="text_10">
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(211.799469 142.728632)">high-resolution satellite,</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(213.185125 151.782409)">other sensor or ground</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(225.450766 161.092202)">source; revisit</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 6.5px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="347.24325" y="125.578177" transform="rotate(-0 347.24325 125.578177)">Decision makers</text>
   </g>
   <g id="text_12">
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(323.403438 143.248366)">commanders and</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(316.580734 151.9043)">policy officials; human</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(314.7415 161.004749)">judgement on any force</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 6.5px; font-family: 'Inter'; text-anchor: middle; fill: #ffffff" x="43.507125" y="125.578177" transform="rotate(-0 43.507125 125.578177)">Adversary</text>
   </g>
   <g id="text_14">
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(14.87325 142.758538)">decoys, camouflage,</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(20.163938 151.969097)">emission control,</text>
    <text style="font-size: 5.8px; font-family: 'Inter'; fill: #1b1f24" transform="translate(12.062969 161.004749)">spoofing, attacks on AI</text>
   </g>
