   <g id="text_1">
    <text style="font-size: 6.2px; font-family: 'Inter'; fill: #1b1f24" transform="translate(199.3425 142.233053)">LuGRE (2025) tracked GPS and Galileo on the Moon:</text>
    <text style="font-size: 6.2px; font-family: 'Inter'; fill: #1b1f24" transform="translate(193.286844 151.015438)">signals ≈ 30 dB weaker than on Earth, high-gain antenna</text>
    <text style="font-size: 6.2px; font-family: 'Inter'; fill: #1b1f24" transform="translate(232.341031 161.022322)">and sensitive receiver needed</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.4px; font-family: 'Inter'; text-anchor: middle; fill: #7f8c8d" x="120.06" y="171.213125" transform="rotate(-0 120.06 171.213125)">GNSS MEO shell (≈ 20 000 km) and GEO (36 000 km)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #d9772b" transform="translate(251.2745 46.25525)">main-lobe and side-lobe signals</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #d9772b" transform="translate(267.192 53.999)">spilling past the Earth</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(353.613 112.65725)">Moon</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(341.4585 120.401)">(384 000 km)</text>
   </g>
   <g id="text_5">
