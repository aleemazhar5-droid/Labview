    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(52.047 91.484844)">hard-body circle</text>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(77.094 99.425531)"/>
    <text style="font-size: 6.4px; font-family: 'Inter'; fill: #1b1f24" transform="translate(41.9905 110.844219)">Typical LEO encounter:</text>
